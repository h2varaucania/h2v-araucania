version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: h2v-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: h2v_araucania
      POSTGRES_USER: h2v_admin
      POSTGRES_PASSWORD: h2v_dev_2026
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U h2v_admin -d h2v_araucania"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
