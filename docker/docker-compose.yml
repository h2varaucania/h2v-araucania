version: "3.9"

# PRODUCCIÓN: Next.js + Payload CMS + PostgreSQL + Nginx
# Uso: docker compose -f docker/docker-compose.yml up -d

services:
  postgres:
    image: postgres:16-alpine
    container_name: h2v-postgres-prod
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-h2v_araucania}
      POSTGRES_USER: ${POSTGRES_USER:-h2v_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-h2v_admin} -d ${POSTGRES_DB:-h2v_araucania}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - h2v-net

  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: h2v-app
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URI: postgresql://${POSTGRES_USER:-h2v_admin}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-h2v_araucania}
      PAYLOAD_SECRET: ${PAYLOAD_SECRET:?Set PAYLOAD_SECRET}
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
    ports:
      - "3000:3000"
    volumes:
      - uploads:/app/public/uploads
    networks:
      - h2v-net

  nginx:
    image: nginx:alpine
    container_name: h2v-nginx
    restart: always
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - certbot-etc:/etc/letsencrypt:ro
    networks:
      - h2v-net

volumes:
  pgdata:
  uploads:
  certbot-etc:

networks:
  h2v-net:
    driver: bridge
